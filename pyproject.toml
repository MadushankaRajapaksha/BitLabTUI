[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "BitLabTUI"
version = "0.0.0"
description = "BitLabTUI"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = ["rich>=10.0.0", "typer>=0.9.0", "textual>=0.1.0"]


[project.scripts]
BitLabTUI = "BitLabTUI.cli:main"


[tool.setuptools]
packages = ["BitLabTUI"]
